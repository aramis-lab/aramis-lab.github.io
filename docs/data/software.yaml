- name: "Clinica"
  icon: "images/icons/clinica/clinica_icon_flat.png"
  description: |
    Clinica is a software platform for clinical neuroscience research, enabling multimodal brain image analysis of large-scale datasets. It facilitates the application of advanced analysis pipelines to diverse clinical studies. To this end, it integrates a comprehensive set of processing tools for the main neuroimaging modalities: anatomical MRI, diffusion MRI, and PET.

    For each modality, Clinica enables the extraction of various types of features (regional measures, parametric maps, surfaces, etc.). These features can then be used as input for statistical modeling or machine learning methods. Processing pipelines are based on combinations of open-source tools developed by the community. Clinica follows the BIDS specification for input data and proposes one for the storage of processed outputs. Clinica is written in Python and leverages the Nipype system for pipelining. It combines widely used software for neuroimaging data analysis (SPM, FreeSurfer, ANTs, FSL, MRtrix, etc.) and machine learning (scikit-learn).
  references:
    - title: "Clinica: an open source software platform for reproducible clinical neuroscience studies"
      venue: "Frontiers in Neuroinformatics"
      year: 2021
      doi: "10.3389/fninf.2021.689675"
      pdf: "https://hal.inria.fr/hal-02549242/document"
    - title: "Convolutional Neural Networks for Classification of Alzheimer's Disease: Overview and Reproducible Evaluation"
      venue: "Medical Image Analysis"
      year: 2020
      doi: "10.1016/j.media.2020.101694"
      pdf: "https://hal.inria.fr/hal-02562504/document"
    - title: "Reproducible evaluation of classification methods in Alzheimer's disease: Framework and application to MRI and PET data"
      venue: "NeuroImage"
      year: 2018
      doi: "10.1016/j.neuroimage.2018.08.050"
      pdf: "https://hal.inria.fr/hal-01858384/document"
    - title: "An Automated Pipeline for the Analysis of PET Data on the Cortical Surface"
      venue: "Frontiers in Neuroinformatics"
      year: 2018
      doi: "10.3389/fninf.2018.00094"
      pdf: "https://www.frontiersin.org/articles/10.3389/fninf.2018.00094/pdf"
  github: "https://github.com/aramis-lab/clinica"
  website: "http://www.clinica.run/"
  email: "ninon.burgos@cnrs.fr"

- name: "ClinicaDL"
  icon: "images/icons/clinicadl/clinicadl_black.png"
  iconDark: "images/icons/clinicadl/clinicadl_white.png"
  description: |
    ClinicaDL is a Python open-source software for neuroimaging data processing with deep learning. This software includes many functionalities, such as neuroimaging preprocessing, synthetic dataset generation, label definition, data split with similar demographics, architecture search, network training, performance evaluation and trained network interpretation. The three main objectives of ClinicaDL are to (1) help manipulate neuroimaging datasets, (2) prevent data leakage from biasing results and (3) reproduce deep learning experiments.
  references:
    - title: "ClinicaDL: an open-source deep learning software for reproducible neuroimaging processing"
      venue: "HAL Preprint"
      year: 2021
      doi: ""
      pdf: "https://www.frontiersin.org/articles/10.3389/fninf.2018.00094/pdf"
  github: "https://github.com/aramis-lab/clinicaDL"
  website: "https://clinicadl.readthedocs.io/en/stable/"
  email: "ninon.burgos@cnrs.fr"

- name: "Leaspy"
  icon: "images/icons/leaspy/leaspy_logo-300x180.png"
  description: |
    Leaspy is a software package for the statistical analysis of longitudinal data, particularly medical data that come in the form of repeated observations of patients at different time-points. Considering these series of short-term data, the software aims at: recombining them to reconstruct the long-term spatio-temporal trajectory of evolution; positioning each patient's observations relative to the group-average timeline, in terms of both temporal differences (time shift and acceleration factor) and spatial differences (different sequences of events, spatial pattern of progression); quantifying the impact of cofactors (gender, genetic mutation, environmental factors) on the evolution of the signal; imputing missing values; predicting future observations; simulating virtual patients to unbias the initial cohort or mimic its characteristics.
  references:
    - title: "Intensive application for Alzheimer's Disease progression: AD Course Map charts Alzheimer's disease progression"
      venue: "Scientific Reports"
      year: 2021
      doi: "10.1038/s41598-021-87434-1"
      pdf: "http://www.jmlr.org/papers/volume18/17-197/17-197.pdf"
    - title: "A Bayesian mixed-effects model to learn trajectories of changes from repeated manifold-valued observations"
      venue: "Journal of Machine Learning Research (JMLR)"
      year: 2017
      doi: ""
      pdf: "http://www.jmlr.org/papers/volume18/17-197/17-197.pdf"
    - title: "Spatiotemporal propagation of the cortical atrophy: population and individual patterns"
      venue: "Frontiers in Neurology"
      year: 2018
      doi: ""
      pdf: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5945895/"
  github: "https://github.com/aramis-lab/leaspy"
  website: "https://disease-progression-modelling.github.io/pages/models/disease_course_mapping.html"
  email: "sophie.tezenas@aphp.fr"

- name: "sndsTools"
  icon: "images/icons/sndsTools/sndsTools_logo.png"
  description: |
    sndsTools is a community-driven R package designed to streamline the extraction, cleaning, and harmonisation of healthcare utilisation data from the French National Health Data System (SNDS), which is a crucial resource for large-scale real-world evidence research. Initiated after multidisciplinary discussions at the Emois congress in March 2024, and coordinated by T. Nedelec (ARAMIS) alongside collaborators from the French Health Authority (HAS) and AP-HM, sndsTools addresses core challenges in SNDS data management. The package greatly simplifies recurring steps in SNDS-based studies, making routine data extraction and reproducibility accessible for a growing community of users in epidemiology and medical data science. With a modular, evolving design and long-term support ambitions, sndsTools is released under the EUPL licence to foster open, collaborative development and ensure compatibility with the wider public health research ecosystem.
  references: []
  github: "https://github.com/sndstoolers/sndsTools"
  website: "https://sndstoolers.github.io/sndsTools/"
  email: "thomas.nedelec@icm-institute.org"

- name: "PhagoStat"
  icon: "images/icons/phagostat/phagostat_logo.png"
  description: |
    The PhagoStat pipeline is able to process large datasets and includes a data quality verification module to counteract potential perturbations such as microscope movements and frame blurring. We also propose an explainable cell segmentation module to improve the interpretability of deep learning methods compared to black-box algorithms. This includes two interpretable deep learning capabilities: visual explanation and model simplification. We demonstrate that interpretability in deep learning is not the opposite of high performance, by additionally providing essential deep learning algorithm optimization insights and solutions. Moreover, incorporating interpretable modules results in an efficient architecture design and optimized execution time. We apply this pipeline to quantify and analyze microglial cell phagocytosis in frontotemporal dementia (FTD) and obtain statistically reliable results showing that FTD mutant cells are larger and more aggressive than control cells. The method has been tested and validated on several public benchmarks achieving state-of-the-art performance. To stimulate translational approaches and future studies, we release an open-source end-to-end pipeline and a unique microglial cell phagocytosis dataset for immune system characterization in neurodegenerative diseases research. This pipeline and the associated dataset will consistently crystallize future advances in this field, promoting the development of efficient and effective interpretable algorithms dedicated to the critical domain of neurodegenerative diseases' characterization.
  references:
    - title: "PhagoStat a scalable and interpretable end to end framework for efficient quantification of cell phagocytosis in neurodegenerative disease studies"
      venue: "Sci Rep"
      year: 2024
      volume: "14"
      pages: "6482"
      doi: "10.1038/s41598-024-56081-7"
      pdf: ""
  github: "https://github.com/ounissimehdi/PhagoStat"
  website: ""
  email: "daniel.racoceanu@sorbonne-universite.fr"